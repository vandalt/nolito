[build-system]
requires = ["hatch-vcs>=0.4.0", "hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nolito"
dynamic = ["version"]
description = "Minimal Nolio API client for OAuth login and planned sessions retrieval."
authors = [{name = "Thomas Vandal", email = "thomas.vandal@umontreal.ca"}]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6.0",
  "requests>=2.32.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/nolito/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nolito"]