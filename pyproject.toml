[build-system]
requires = ["hatch-vcs>=0.4.0", "hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nolito"
dynamic = ["version"]
description = "Python interface for the Nolio API"
authors = [{name = "Thomas Vandal", email = "thomas.vandal@umontreal.ca"}]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6.0",
  "requests>=2.32.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/nolito/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nolito"]

[dependency-groups]
dev = [
  "ipython",
  "ipdb",
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "test"},
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
]
lint = ["ruff"]
test = ["pytest"]

[tool.pytest.ini_options]
markers = [
  "integration: tests that call the live Nolio API using a dedicated test account",
]
